<!doctype html>
<html data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#e685b5" />
    <link rel="icon" type="image/svg+xml" href="/static/public/icons/icon-nobg.svg">
    <link rel="apple-touch-icon" sizes="256x256" href="/static/public/icons/icon-512.png">
    <link rel="mask-icon" href="/static/public/icons/icon.svg" color="#e685b5">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <title>{% block title %}{% endblock %} - PlotlyShare</title>
    
    <link rel="stylesheet" href="/static/public/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=Chakra+Petch">
    <meta property="og:image" content="{{ url_for('show_all', _external=True) }}static/public/icons/icon-512.png"/>
    {% block head %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
  </head>

  <body>
    <section class="content">
      <header {% block header_class %}{% endblock %}>
        <div id="header_logo">
          <img src="/static/public/icons/icon-nobg.svg" width="96px">
          <h3 class="col-hide-small">plotlyshare</h3>
        </div>
        {% block header %}{% endblock %}
      </header>
      {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </section>
  </body>

</html>
