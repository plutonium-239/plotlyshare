{% extends 'base.html' %}

{% block head %}
	<meta property="og:title" content="Plot {{ plot['name'] }}"/>
	<meta property="og:description" content="Open this interactive plotly plot in your browser!"/>
	<meta property="og:site_name" content="PlotlyShare - private instance on deta space"/>
	<meta property="og:type" content="website"/>
	<meta property="og:url" content="{{ url_for('show_plot', key=plot['key'], _external=True) }}"/>
	<link rel="stylesheet" href="/static/public/plot.css">
	<script type="text/javascript" src="/static/public/mainscript.js" defer></script>
	<script type="text/javascript" src="/static/public/activity.js" defer></script>
{% endblock %}

{% block title %}{{ plot['name'] }}{% endblock %}

{% block header_class %}{% endblock %}

{% block header %}
	<div class="col-name-outer">
		<form action="{{ url_for('update_name', key=(plot['key'])) }}" method="post" class="text-center" id="update_name_form">
			<input type="text" name="name_holder" class="d-none" value="{{ plot['name'] }}" />
			<span role="textbox" contentEditable="plaintext-only" data-enable-grammarly="false" class="textarea col-name form-control-plaintext" value="{{ plot['name'] }}">{{ plot['name'] }}</span>
			<button type="submit" class="btn btn-success custom-btn">
				<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="m10 13.6l5.9-5.9q.275-.275.7-.275t.7.275q.275.275.275.7t-.275.7l-6.6 6.6q-.3.3-.7.3t-.7-.3l-2.6-2.6q-.275-.275-.275-.7t.275-.7q.275-.275.7-.275t.7.275z"/></svg>
			</button>
		</form>
	</div>
	<button class="btn btn-info custom-btn btn-collapse" type="button" data-bs-toggle="collapse" data-bs-target="#active_share">
		<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="m21.707 11.293l-8-8A1 1 0 0 0 12 4v3.545A11.015 11.015 0 0 0 2 18.5V20a1 1 0 0 0 1.784.62a11.456 11.456 0 0 1 7.887-4.049c.05-.006.175-.016.329-.026V20a1 1 0 0 0 1.707.707l8-8a1 1 0 0 0 0-1.414M14 17.586V15.5a1 1 0 0 0-1-1c-.255 0-1.296.05-1.562.085a14.005 14.005 0 0 0-7.386 2.948A9.013 9.013 0 0 1 13 9.5a1 1 0 0 0 1-1V6.414L19.586 12Z"/></svg>
	</button>
	<div id="active_share" class="collapse dont-collapse-sm">
		<div id="active_user_list" class="text-center">0 viewers<br>(+ 0 owners)</div>
		<button class="btn btn-outline-info custom-btn custom-clipbtn btn-outline-pink" onclick="navigator.clipboard.writeText(location.href)">
			<svg class="svg-uncheck" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 11.95q.725-.8 1.113-1.825T14 8q0-1.1-.387-2.125T12.5 4.05q1.5.2 2.5 1.325T16 8q0 1.5-1 2.625t-2.5 1.325M17.45 20q.275-.45.413-.962T18 18v-1q0-.9-.4-1.713t-1.05-1.437q1.275.45 2.363 1.163T20 17v1q0 .825-.587 1.413T18 20zM20 11h-1q-.425 0-.712-.288T18 10q0-.425.288-.712T19 9h1V8q0-.425.288-.712T21 7q.425 0 .713.288T22 8v1h1q.425 0 .713.288T24 10q0 .425-.288.713T23 11h-1v1q0 .425-.288.713T21 13q-.425 0-.712-.288T20 12zM8 12q-1.65 0-2.825-1.175T4 8q0-1.65 1.175-2.825T8 4q1.65 0 2.825 1.175T12 8q0 1.65-1.175 2.825T8 12m-8 6v-.8q0-.85.438-1.562T1.6 14.55q1.55-.775 3.15-1.162T8 13q1.65 0 3.25.388t3.15 1.162q.725.375 1.163 1.088T16 17.2v.8q0 .825-.587 1.413T14 20H2q-.825 0-1.412-.587T0 18"/></svg>
			<svg class="svg-check" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="m10 17l-4-4l1.41-1.41L10 14.17l6.59-6.59L18 9m-6-6a1 1 0 0 1 1 1a1 1 0 0 1-1 1a1 1 0 0 1-1-1a1 1 0 0 1 1-1m7 0h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Z"/></svg>
		</button>
	</div>
{% endblock %}

{% block content %}
	{{ plot['html']|safe }}
{% endblock %}
